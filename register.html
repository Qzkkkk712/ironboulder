<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>注册 ironboulder</title>
  <link rel="icon" href="assets/icons/ironboulder.jpeg?v=20260903n">
  <link rel="stylesheet" href="styles.css?v=20260903n">
</head>
<body>
  <div class="auth-screen">
    <form class="auth-card" id="registerForm" novalidate>
      <span class="brand-mark brand-image"><img src="assets/icons/ironboulder.jpeg?v=20260903n" alt="ironboulder"></span>
      <h2>注册 ironboulder</h2>
      <p>设置邮箱和密码后注册，再到邮箱确认激活</p>
      <label class="field">
        <span>邮箱</span>
        <input type="email" id="registerEmail" name="email" autocomplete="username" placeholder="you@example.com" required>
      </label>
      <label class="field">
        <span>设置密码</span>
        <input type="password" id="registerPassword" name="password" autocomplete="new-password" placeholder="至少 6 位" required>
      </label>
      <div class="auth-actions single">
        <button class="btn" id="sendRegister" type="submit">注册</button>
      </div>
      <p class="register-note">注册后请到邮箱点击确认链接，账号才会激活。</p>
      <button class="link-btn auth-toggle" id="goLogin" type="button">已有账号？去登录</button>
      <p class="auth-message" id="registerMessage"></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js?v=20260903n"></script>
  <script>
    'use strict';

    const MAIN_FILE = 'fitness-climbing-strength-20260903.html';
    const emailInput = document.getElementById('registerEmail');
    const passwordInput = document.getElementById('registerPassword');
    const message = document.getElementById('registerMessage');
    const sendButton = document.getElementById('sendRegister');
    const form = document.getElementById('registerForm');
    let authClient = null;

    function setMessage(text) {
      message.textContent = text || '';
    }

    function validEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function appUrl() {
      const configured = window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.siteUrl;
      if (configured) return configured;
      if (location.protocol === 'file:') return '';
      const url = new URL(MAIN_FILE, location.href);
      url.hash = '';
      url.search = '';
      return url.href;
    }

    async function sendRegisterLink(client) {
      if (!client) {
        setMessage('云端配置未加载，请稍后重试');
        return;
      }
      const email = emailInput.value.trim();
      if (!validEmail(email)) {
        setMessage('请输入有效的邮箱地址');
        emailInput.focus();
        return;
      }
      const redirectTo = appUrl();
      if (!redirectTo) {
        setMessage('请通过网页地址打开注册页，邮件里的登录链接才能带你回到应用');
        return;
      }

      const password = passwordInput.value;
      if (!password || password.length < 6) {
        setMessage('请设置至少 6 位密码');
        passwordInput.focus();
        return;
      }

      sendButton.disabled = true;
      setMessage('正在注册…');
      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: redirectTo }
      });
      sendButton.disabled = false;
      if (error) {
        if (/already registered/i.test(error.message)) {
          setMessage('这个邮箱已经注册。忘记密码时可用邮箱链接登录，并在资料页设置新密码。');
        } else {
          setMessage(error.message);
        }
        return;
      }
      if (data.session) {
        window.location.href = MAIN_FILE;
        return;
      }
      sendButton.textContent = '重新发送';
      setMessage('注册成功，请到邮箱点击确认链接完成激活，然后返回密码登录');
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
    });
    sendButton.addEventListener('click', () => sendRegisterLink(authClient));
    document.getElementById('goLogin').addEventListener('click', () => {
      window.location.href = MAIN_FILE;
    });

    (async () => {
      const cfg = window.SUPABASE_CONFIG || {};
      if (!cfg.url || !cfg.anonKey || !window.supabase) {
        setMessage('云端配置未加载，请稍后重试');
        return;
      }
      authClient = window.supabase.createClient(cfg.url, cfg.anonKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      });
      const { data } = await authClient.auth.getSession();
      if (data.session) {
        window.location.replace(MAIN_FILE);
      }
    })();
  </script>
</body>
</html>
